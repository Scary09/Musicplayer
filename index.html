<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Audio Specimen Visualizer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body, #root {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #060607;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const PALETTES = [
      {
        name: "MONOLITH",
        bg: "#060607",
        ink: "#f0f0f2",
        accent: "#ffffff",
        glow: "rgba(255, 255, 255, 0.4)",
        textGlow: "0 0 20px rgba(255, 255, 255, 0.4)",
        lensTint: "rgba(255, 255, 255, 0.05)",
        discSheen: "#0c0c10",
        discRing: "#ffffff",
        reticle: "#ffffff",
        gridColor: "rgba(255, 255, 255, 0.1)",
        tag: "MINIMAL",
        grooveBase: "255, 255, 255",
        iridescentSheen: ["rgba(255,255,255,0.1)", "rgba(200,200,200,0.2)", "rgba(255,255,255,0.1)", "rgba(150,150,150,0.2)"]
      },
      {
        name: "CYBERPUNK",
        bg: "#0b0213",
        ink: "#e0f2fe",
        accent: "#ff00ff",
        glow: "rgba(255, 0, 255, 0.6)",
        textGlow: "0 0 20px rgba(255, 0, 255, 0.6)",
        lensTint: "rgba(0, 255, 255, 0.1)",
        discSheen: "#1a0529",
        discRing: "#00ffff",
        reticle: "#ff00ff",
        gridColor: "rgba(0, 255, 255, 0.15)",
        tag: "NEON",
        grooveBase: "255, 255, 255",
        iridescentSheen: ["rgba(255,0,255,0.4)", "rgba(0,255,255,0.4)", "rgba(128,0,255,0.4)", "rgba(255,0,128,0.4)"]
      },
      {
        name: "CUTESY",
        bg: "#fff0f5",
        ink: "#2d1f25",
        accent: "#ff69b4",
        glow: "rgba(255, 105, 180, 0.4)",
        textGlow: "0 2px 15px rgba(255,105,180,0.5), 0 2px 4px rgba(0,0,0,0.3)",
        lensTint: "rgba(255, 182, 193, 0.1)",
        discSheen: "#ffe4e1",
        discRing: "#ff69b4",
        reticle: "#ff1493",
        gridColor: "rgba(255, 105, 180, 0.25)",
        tag: "PASTEL",
        grooveBase: "200, 80, 130",
        iridescentSheen: ["rgba(255,182,193,0.5)", "rgba(255,218,185,0.5)", "rgba(230,230,250,0.5)", "rgba(176,224,230,0.5)"]
      },
      {
        name: "CHILL",
        bg: "#111827",
        ink: "#f3f4f6",
        accent: "#3b82f6",
        glow: "rgba(59, 130, 246, 0.5)",
        textGlow: "0 0 20px rgba(59, 130, 246, 0.5)",
        lensTint: "rgba(96, 165, 250, 0.1)",
        discSheen: "#1f2937",
        discRing: "#3b82f6",
        reticle: "#60a5fa",
        gridColor: "rgba(96, 165, 250, 0.12)",
        tag: "RELAX",
        grooveBase: "255, 255, 255",
        iridescentSheen: ["rgba(59,130,246,0.3)", "rgba(16,185,129,0.3)", "rgba(139,92,246,0.3)", "rgba(56,189,248,0.3)"]
      }
    ];

    function drawDiscCanvas(ctx, palette) {
      const cx = 1024, cy = 1024;
      ctx.clearRect(0, 0, 2048, 2048);
      ctx.fillStyle = palette.discSheen;
      ctx.fillRect(0, 0, 2048, 2048);

      const gBase = palette.grooveBase || "255, 255, 255";
      for (let r = 320; r < 980; r += 2.5) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        const isTrack = r % 30 === 0;
        ctx.strokeStyle = isTrack ? `rgba(${gBase}, 0.25)` : `rgba(${gBase}, 0.06)`;
        ctx.lineWidth = isTrack ? 1.6 : 0.8;
        ctx.stroke();
      }

      const rainbow = ctx.createConicGradient(Math.PI / 4, cx, cy);
      const sheens = palette.iridescentSheen;
      rainbow.addColorStop(0.0, "rgba(255,255,255,0.04)");
      rainbow.addColorStop(0.08, sheens[0]);
      rainbow.addColorStop(0.18, "rgba(255,255,255,0.9)");
      rainbow.addColorStop(0.28, sheens[1]);
      rainbow.addColorStop(0.40, "rgba(255,255,255,0.04)");
      rainbow.addColorStop(0.58, sheens[2]);
      rainbow.addColorStop(0.68, "rgba(255,255,255,0.9)");
      rainbow.addColorStop(0.78, sheens[3]);
      rainbow.addColorStop(0.92, sheens[0]);
      rainbow.addColorStop(1.0, "rgba(255,255,255,0.04)");

      ctx.beginPath();
      ctx.arc(cx, cy, 978, 0, Math.PI * 2);
      ctx.fillStyle = rainbow;
      ctx.fill();

      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(cx, cy, 310, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }

    function parseLRC(lrcString) {
      if (!lrcString) return [];
      const lines = lrcString.split("\n");
      const parsed = [];
      const timeRegex = /\[(\d{1,2}):(\d{2})(?:\.(\d{2,3}))?\]/;

      for (let line of lines) {
        const match = timeRegex.exec(line);
        if (match) {
          const mins = parseInt(match[1], 10);
          const secs = parseInt(match[2], 10);
          const ms = match[3] ? parseFloat("0." + match[3].padEnd(3, "0")) : 0;
          const totalSecs = mins * 60 + secs + ms;
          const text = line.replace(timeRegex, "").trim();
          if (text && !text.startsWith("[") && !text.toLowerCase().includes("lyrics by") && !text.toLowerCase().includes("sync by")) {
            parsed.push({ time: totalSecs, text });
          }
        }
      }
      return parsed.sort((a, b) => a.time - b.time);
    }

    function cleanTrackString(str) {
      return str
        .replace(/\.(mp3|wav|m4a|aac|ogg|flac)$/i, "")
        .replace(/\[.*?\]|\(.*?\)/g, "")
        .replace(/feat\..*|ft\..*/i, "")
        .replace(/- topic/i, "")
        .replace(/[_\-+]/g, " ")
        .trim();
    }

    function formatTime(secs) {
      if (!secs || isNaN(secs) || secs < 0) return "00:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function App() {
      const [paletteIndex, setPaletteIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [audioSourceType, setAudioSourceType] = useState("idle");
      const [trackMeta, setTrackMeta] = useState({ title: "CASE FILE: NO AUDIO", artist: "STANDBY" });
      const [lyrics, setLyrics] = useState([]);
      const [activeLyricIndex, setActiveLyricIndex] = useState(-1);
      const [activeWordIndex, setActiveWordIndex] = useState(-1);
      const [lyricStatus, setLyricStatus] = useState("STANDBY");
      const [isLoadingStream, setIsLoadingStream] = useState(false);
      const [loadingText, setLoadingText] = useState("PARSING AUDIO FEED...");
      
      const [volume, setVolume] = useState(1.0);
      const [isMuted, setIsMuted] = useState(false);

      const canvasRef = useRef(null);
      const threeMountRef = useRef(null);
      const threeContextRef = useRef(null);
      const audioRef = useRef(null);
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const sourceNodeRef = useRef(null);
      const fileInputRef = useRef(null);
      const progressBarRef = useRef(null);
      const progressFillRef = useRef(null);
      const progressThumbRef = useRef(null);
      const timeCurrentRef = useRef(null);
      const timeDurationRef = useRef(null);
      const volumeBarRef = useRef(null);

      const isDraggingRef = useRef(false);
      const dragStartPosRef = useRef({ x: 0, y: 0 });
      const clickStartPosRef = useRef({ x: 0, y: 0 });
      const dragStartTimeRef = useRef(0);
      const dragVelocityRef = useRef({ x: 0, y: 0 });
      const discRotRef = useRef({ x: 0.52, y: -0.22, z: 0 });
      const isHoveredRef = useRef(false);
      const hoverTargetRef = useRef(null);
      const scrollMomentumRef = useRef(0);
      const isPlayingRef = useRef(false);
      const spinVelocityRef = useRef(0);
      const scaleVelocityRef = useRef(1);
      const mouseRef = useRef({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        lerpX: window.innerWidth / 2,
        lerpY: window.innerHeight / 2
      });
      const bassEnergyRef = useRef(0);
      const audioTimeRef = useRef(0);
      const lastTimeRef = useRef(performance.now());
      const lyricsRef = useRef([]);
      const activeLyricIndexRef = useRef(-1);
      const activeWordIndexRef = useRef(-1);
      const isSeekingBarRef = useRef(false);
      const isDraggingVolRef = useRef(false);

      const activePalette = PALETTES[paletteIndex];

      useEffect(() => {
        isPlayingRef.current = isPlaying;
      }, [isPlaying]);

      useEffect(() => {
        lyricsRef.current = lyrics;
      }, [lyrics]);

      const fetchLyrics = useCallback(async (rawTitle, rawArtist) => {
        const title = cleanTrackString(rawTitle);
        const artist = cleanTrackString(rawArtist);

        if (!title || title === "NO AUDIO LOADED" || title === "IDLE") {
          setLyrics([]);
          setLyricStatus("STANDBY");
          return;
        }

        setLyricStatus("SEARCHING LRC...");

        try {
          if (artist && artist !== "UNKNOWN ARTIST" && artist !== "IDLE") {
            const exactRes = await fetch(
              `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`
            );
            if (exactRes.ok) {
              const exactData = await exactRes.json();
              if (exactData?.syncedLyrics) {
                const parsed = parseLRC(exactData.syncedLyrics);
                if (parsed.length > 0) {
                  setLyrics(parsed);
                  setLyricStatus("SYNCED");
                  return;
                }
              }
            }
          }

          const query = (artist && artist !== "UNKNOWN ARTIST" && artist !== "IDLE") ? `${artist} ${title}` : title;
          const searchRes = await fetch(
            `https://lrclib.net/api/search?q=${encodeURIComponent(query)}`
          );

          if (searchRes.ok) {
            const results = await searchRes.json();
            if (Array.isArray(results) && results.length > 0) {
              const matchWithSync = results.find((r) => r.syncedLyrics && r.syncedLyrics.length > 10);
              if (matchWithSync) {
                const parsed = parseLRC(matchWithSync.syncedLyrics);
                if (parsed.length > 0) {
                  setLyrics(parsed);
                  setTrackMeta({
                    title: matchWithSync.trackName.toUpperCase(),
                    artist: matchWithSync.artistName.toUpperCase()
                  });
                  setLyricStatus("SYNCED");
                  return;
                }
              }
            }
          }

          setLyrics([]);
          setLyricStatus("NO LYRICS");
        } catch (err) {
          setLyrics([]);
          setLyricStatus("NO LYRICS");
        }
      }, []);

      const initWebAudio = useCallback(() => {
        if (!audioRef.current) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!audioCtxRef.current) {
          try {
            audioCtxRef.current = new AudioCtx();
          } catch (e) {
            return;
          }
        }

        const ctx = audioCtxRef.current;

        if (!analyserRef.current) {
          try {
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 128;
            analyserRef.current = analyser;
          } catch (e) {
            return;
          }
        }

        if (!sourceNodeRef.current && analyserRef.current) {
          try {
            const src = ctx.createMediaElementSource(audioRef.current);
            src.connect(analyserRef.current);
            analyserRef.current.connect(ctx.destination);
            sourceNodeRef.current = src;
          } catch (e) {
            return;
          }
        }

        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }
      }, []);

      const togglePlay = () => {
        if (audioSourceType === "file" && audioRef.current) {
          initWebAudio();
          if (isPlaying) {
            audioRef.current.pause();
            setIsPlaying(false);
          } else {
            audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(true));
          }
        }
      };

      const syncSeekerUI = (curr, dur) => {
        if (!dur || dur <= 0) return;
        const ratio = Math.max(0, Math.min(1, curr / dur));
        const pct = (ratio * 100).toFixed(2) + "%";
        if (progressFillRef.current) progressFillRef.current.style.width = pct;
        if (progressThumbRef.current) progressThumbRef.current.style.left = pct;
        if (timeCurrentRef.current) timeCurrentRef.current.textContent = formatTime(curr);
        if (timeDurationRef.current) timeDurationRef.current.textContent = formatTime(dur);
      };

      const restartTrack = () => {
        if (audioRef.current) {
          audioRef.current.currentTime = 0;
          audioTimeRef.current = 0;
          syncSeekerUI(0, audioRef.current.duration || 1);
          if (!isPlaying && audioSourceType === "file") {
            initWebAudio();
            audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(true));
          }
        }
      };

      const handleAudioUpload = (file) => {
        if (!file || !file.type.startsWith("audio/")) return;
        setIsLoadingStream(true);
        setLoadingText("DECODING LOCAL AUDIO SPECIMEN...");
        initWebAudio();
        const url = URL.createObjectURL(file);

        setLyrics([]);
        setActiveLyricIndex(-1);
        setActiveWordIndex(-1);
        activeLyricIndexRef.current = -1;
        activeWordIndexRef.current = -1;
        setAudioSourceType("file");

        const rawName = file.name.replace(/\.[^/.]+$/, "");
        let artist = "UNKNOWN ARTIST";
        let title = rawName;

        if (rawName.includes(" - ")) {
          const parts = rawName.split(" - ");
          artist = parts[0].trim();
          title = parts[1].trim();
        } else if (rawName.includes("_-_")) {
          const parts = rawName.split("_-_");
          artist = parts[0].trim();
          title = parts[1].trim();
        }

        setTrackMeta({ title: title.toUpperCase(), artist: artist.toUpperCase() });

        if (audioRef.current) {
          audioRef.current.src = url;
          audioRef.current.currentTime = 0;
          audioTimeRef.current = 0;
          syncSeekerUI(0, 1);
          audioRef.current.load();
          audioRef.current.play()
            .then(() => {
              setIsPlaying(true);
              setIsLoadingStream(false);
            })
            .catch(() => {
              setIsLoadingStream(false);
            });
        }

        fetchLyrics(title, artist);
      };

      const applySeekFromClientX = (clientX) => {
        if (!progressBarRef.current || !audioRef.current || !audioRef.current.duration) return;
        const rect = progressBarRef.current.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const targetTime = ratio * audioRef.current.duration;
        audioRef.current.currentTime = targetTime;
        audioTimeRef.current = targetTime;
        syncSeekerUI(targetTime, audioRef.current.duration);
      };

      const applyVolumeFromClientY = (clientY) => {
        if (!volumeBarRef.current || !audioRef.current) return;
        const rect = volumeBarRef.current.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, 1 - (clientY - rect.top) / rect.height));
        const newVol = Math.round(ratio * 100) / 100;
        audioRef.current.volume = newVol;
        setVolume(newVol);
        if (newVol > 0 && isMuted) {
          setIsMuted(false);
          audioRef.current.muted = false;
        }
      };

      const toggleMute = () => {
        if (!audioRef.current) return;
        const nextMute = !isMuted;
        setIsMuted(nextMute);
        audioRef.current.muted = nextMute;
      };

      useEffect(() => {
        const handlePointerMove = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          mouseRef.current.x = clientX;
          mouseRef.current.y = clientY;

          if (isSeekingBarRef.current) {
            applySeekFromClientX(clientX);
          } else if (isDraggingVolRef.current) {
            applyVolumeFromClientY(clientY);
          } else if (isDraggingRef.current) {
            const dx = clientX - dragStartPosRef.current.x;
            const dy = clientY - dragStartPosRef.current.y;
            dragVelocityRef.current = { x: dx * 0.006, y: dy * 0.006 };
            discRotRef.current.y += dx * 0.01;
            discRotRef.current.x += dy * 0.01;
            dragStartPosRef.current = { x: clientX, y: clientY };
          }
        };

        const handlePointerUp = () => {
          isDraggingRef.current = false;
          isSeekingBarRef.current = false;
          isDraggingVolRef.current = false;
        };

        const handleWheel = (e) => {
          const target = hoverTargetRef.current;
          if (target === "disc" || target === "seeker") {
            scrollMomentumRef.current += e.deltaY * 0.0025;
            if (audioSourceType === "file" && audioRef.current && audioRef.current.duration) {
              const step = (e.deltaY / 120) * 1.5;
              const nextTime = Math.max(0, Math.min(audioRef.current.duration, audioRef.current.currentTime + step));
              audioRef.current.currentTime = nextTime;
              audioTimeRef.current = nextTime;
              syncSeekerUI(nextTime, audioRef.current.duration);
            }
          } else if (target === "volume") {
            if (audioRef.current) {
              const step = -(e.deltaY / 120) * 0.05;
              const nextVol = Math.max(0, Math.min(1, volume + step));
              const roundedVol = Math.round(nextVol * 100) / 100;
              audioRef.current.volume = roundedVol;
              setVolume(roundedVol);
              if (roundedVol > 0 && isMuted) {
                setIsMuted(false);
                audioRef.current.muted = false;
              }
            }
          }
        };

        window.addEventListener("pointermove", handlePointerMove);
        window.addEventListener("touchmove", handlePointerMove, { passive: false });
        window.addEventListener("pointerup", handlePointerUp);
        window.addEventListener("touchend", handlePointerUp);
        window.addEventListener("wheel", handleWheel, { passive: true });
        return () => {
          window.removeEventListener("pointermove", handlePointerMove);
          window.removeEventListener("touchmove", handlePointerMove);
          window.removeEventListener("pointerup", handlePointerUp);
          window.removeEventListener("touchend", handlePointerUp);
          window.removeEventListener("wheel", handleWheel);
        };
      }, [audioSourceType, volume, isMuted]);

      useEffect(() => {
        let renderer, scene, camera;
        let discMesh, centerDiscMesh, hubMesh, progressMesh, vizMesh;
        let spotLight, rimLight, keyLight, ambientLight;
        let baseGroup, spinGroup;
        let texture, texCanvas, tCtx;

        const initThree = () => {
          if (!threeMountRef.current || !window.THREE) return;
          const THREE = window.THREE;

          while (threeMountRef.current.firstChild) {
            threeMountRef.current.removeChild(threeMountRef.current.firstChild);
          }

          scene = new THREE.Scene();
          camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
          camera.position.set(0, 0, 16);

          renderer = new THREE.WebGLRenderer({
            alpha: true,
            antialias: true,
            powerPreference: "high-performance",
            precision: "highp"
          });
          renderer.setSize(1024, 1024);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          const canvasEl = renderer.domElement;
          canvasEl.style.position = "absolute";
          canvasEl.style.left = "50%";
          canvasEl.style.top = "50%";
          canvasEl.style.transform = "translate(-50%, -50%)";
          canvasEl.style.pointerEvents = "none";
          canvasEl.style.width = "100%";
          canvasEl.style.height = "100%";

          threeMountRef.current.appendChild(canvasEl);

          baseGroup = new THREE.Group();
          baseGroup.rotation.x = discRotRef.current.x;
          baseGroup.rotation.y = discRotRef.current.y;
          scene.add(baseGroup);

          spinGroup = new THREE.Group();
          spinGroup.rotation.z = discRotRef.current.z;
          baseGroup.add(spinGroup);

          texCanvas = document.createElement("canvas");
          texCanvas.width = 2048;
          texCanvas.height = 2048;
          tCtx = texCanvas.getContext("2d");

          drawDiscCanvas(tCtx, activePalette);

          texture = new THREE.CanvasTexture(texCanvas);
          texture.anisotropy = 16;
          texture.generateMipmaps = true;

          const geo = new THREE.RingGeometry(0.55, 2.05, 128, 32);
          const mat = new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.12,
            metalness: 0.98,
            side: THREE.DoubleSide
          });
          discMesh = new THREE.Mesh(geo, mat);
          spinGroup.add(discMesh);

          const clearHubGeo = new THREE.RingGeometry(0.24, 0.54, 64);
          const clearHubMat = new THREE.MeshPhysicalMaterial({
            roughness: 0.08,
            transmission: 0.9,
            thickness: 0.3,
            transparent: true,
            opacity: 0.75,
            color: 0xffffff,
            side: THREE.DoubleSide
          });
          centerDiscMesh = new THREE.Mesh(clearHubGeo, clearHubMat);
          spinGroup.add(centerDiscMesh);

          const innerBezelGeo = new THREE.RingGeometry(0.22, 0.25, 48);
          const innerBezelMat = new THREE.MeshBasicMaterial({
            color: activePalette.discRing,
            side: THREE.DoubleSide
          });
          hubMesh = new THREE.Mesh(innerBezelGeo, innerBezelMat);
          spinGroup.add(hubMesh);

          const progressUniforms = {
            uProgress: { value: 0.0 },
            uColor: { value: new THREE.Color(activePalette.accent) }
          };

          const progressMat = new THREE.ShaderMaterial({
            uniforms: progressUniforms,
            transparent: true,
            side: THREE.DoubleSide,
            vertexShader: `
              varying vec2 vPos;
              void main() {
                vPos = position.xy;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform float uProgress;
              uniform vec3 uColor;
              varying vec2 vPos;
              #define TWO_PI 6.28318530718
              
              void main() {
                vec2 p = vPos;
                float r = 2.11; 
                float w = 0.035; 
                
                float angle = atan(p.x, p.y);
                if (angle < 0.0) angle += TWO_PI;
                
                float targetAngle = uProgress * TWO_PI;
                float distMid = abs(length(p) - r);
                
                float bgAlpha = smoothstep(w + 0.01, w - 0.01, distMid) * 0.12;
                
                float arcAlpha = 0.0;
                float glow = 0.0;
                float core = 0.0;
                
                if (uProgress > 0.0) {
                    vec2 startPoint = vec2(0.0, r);
                    vec2 endPoint = vec2(sin(targetAngle) * r, cos(targetAngle) * r);
                    
                    float dStart = length(p - startPoint);
                    float dEnd = length(p - endPoint);
                    float minCapDist = min(dStart, dEnd);
                    
                    if (angle <= targetAngle) {
                        arcAlpha = smoothstep(w + 0.005, w - 0.005, distMid);

              }}
              onPointerUp={(e) => {
                const dt = performance.now() - dragStartTimeRef.current;
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                const dx = clientX - clickStartPosRef.current.x;
                const dy = clientY - clickStartPosRef.current.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dt < 250 && dist < 12) {
                  togglePlay();
                }
              }}
              className="relative w-[62vw] h-[62vw] max-w-[260px] max-h-[260px] sm:w-[70vw] sm:h-[70vw] sm:max-w-[360px] sm:max-h-[360px] md:max-w-[420px] md:max-h-[420px] flex items-center justify-center pointer-events-auto cursor-grab active:cursor-grabbing touch-none select-none transition-transform duration-300 ease-out overflow-visible"
            />
          </div>

          <div className="absolute inset-0 z-20 pointer-events-none p-4 sm:p-14 flex flex-col justify-between">
            <div className="flex justify-between items-start mt-12 sm:mt-16">
              <div
                className={`max-w-[70%] sm:max-w-xl transition-all duration-700 ease-out ${
                  cornerTL.isCurrent && cornerTL.line
                    ? "opacity-100 translate-y-0 scale-100 blur-none"
                    : "opacity-0 -translate-y-4 scale-95 blur-sm pointer-events-none"
                }`}
              >
                <h1 className="leading-snug">
                  {cornerTL.line && renderWordByWord(cornerTL.line.text, cornerTL.wordIndex, cornerTL.isCurrent)}
                </h1>
              </div>

              <div
                className={`max-w-[70%] sm:max-w-xl text-right transition-all duration-700 ease-out flex flex-col items-end ${
                  cornerTR.isCurrent && cornerTR.line
                    ? "opacity-100 translate-y-0 scale-100 blur-none"
                    : "opacity-0 -translate-y-4 scale-95 blur-sm pointer-events-none"
                }`}
              >
                <h1 className="leading-snug">
                  {cornerTR.line && renderWordByWord(cornerTR.line.text, cornerTR.wordIndex, cornerTR.isCurrent)}
                </h1>
              </div>
            </div>

            <div className="flex justify-between items-end mb-28 sm:mb-32">
              <div
                className={`max-w-[70%] sm:max-w-xl transition-all duration-700 ease-out ${
                  cornerBL.isCurrent && cornerBL.line
                    ? "opacity-100 translate-y-0 scale-100 blur-none"
                    : "opacity-0 translate-y-4 scale-95 blur-sm pointer-events-none"
                }`}
              >
                <h1 className="leading-snug">
                  {cornerBL.line && renderWordByWord(cornerBL.line.text, cornerBL.wordIndex, cornerBL.isCurrent)}
                </h1>
              </div>

              <div
                className={`max-w-[70%] sm:max-w-xl text-right transition-all duration-700 ease-out flex flex-col items-end ${
                  cornerBR.isCurrent && cornerBR.line
                    ? "opacity-100 translate-y-0 scale-100 blur-none"
                    : "opacity-0 translate-y-4 scale-95 blur-sm pointer-events-none"
                }`}
              >
                <h1 className="leading-snug">
                  {cornerBR.line && renderWordByWord(cornerBR.line.text, cornerBR.wordIndex, cornerBR.isCurrent)}
                </h1>
              </div>
            </div>
          </div>

          <footer className="relative z-30 pb-[max(1rem,env(safe-area-inset-bottom))] px-4 sm:px-8 md:px-12 flex flex-col items-center w-full mb-1 sm:mb-2 space-y-2 pointer-events-none">
            <div 
              className="w-full max-w-xl pointer-events-auto flex items-center space-x-3 px-4 py-2 rounded-full bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl transition-all duration-300 hover:border-white/20"
              onMouseEnter={() => { hoverTargetRef.current = "seeker"; }}
              onMouseLeave={() => { hoverTargetRef.current = null; }}
            >
              <span ref={timeCurrentRef} className="text-[10px] sm:text-xs font-mono font-medium opacity-70 w-10 text-right tabular-nums">
                00:00
              </span>

              <div 
                ref={progressBarRef}
                onPointerDown={(e) => {
                  isSeekingBarRef.current = true;
                  applySeekFromClientX(e.clientX);
                }}
                className="relative flex-1 h-4 flex items-center cursor-pointer group py-1"
              >
                <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden transition-all group-hover:h-2">
                  <div 
                    ref={progressFillRef}
                    className="h-full rounded-full"
                    style={{ 
                      width: "0%",
                      backgroundColor: activePalette.accent,
                      boxShadow: `0 0 10px ${activePalette.glow}`
                    }}
                  />
                </div>
                <div 
                  ref={progressThumbRef}
                  className="absolute w-3 h-3 rounded-full shadow-lg transform -translate-x-1/2 scale-0 group-hover:scale-100 active:scale-125 transition-transform duration-100 pointer-events-none"
                  style={{ 
                    left: "0%",
                    backgroundColor: activePalette.accent,
                    boxShadow: `0 0 12px ${activePalette.glow}`
                  }}
                />
              </div>

              <span ref={timeDurationRef} className="text-[10px] sm:text-xs font-mono font-medium opacity-70 w-10 tabular-nums">
                00:00
              </span>
            </div>

            <div className="w-full max-w-xl flex items-center justify-between">
              <div className="flex items-center space-x-2 pointer-events-auto">
                <button
                  onClick={restartTrack}
                  disabled={audioSourceType === "idle"}
                  className={`flex items-center justify-center w-9 h-9 sm:w-11 sm:h-11 rounded-full backdrop-blur-md transition-all duration-300 shadow-md ${
                    audioSourceType === "idle" ? "opacity-30 cursor-not-allowed bg-white/5 border border-white/10" : "bg-white/5 border border-white/10 hover:bg-white/15 active:scale-95 cursor-pointer"
                  }`}
                  style={{ color: activePalette.ink }}
                  title="Restart Track (00:00)"
                >
                  <svg className="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                  </svg>
                </button>

                <button
                  onClick={togglePlay}
                  disabled={audioSourceType === "idle"}
                  className={`flex items-center justify-center w-11 h-11 sm:w-13 sm:h-13 rounded-full backdrop-blur-md transition-all duration-300 shadow-lg cursor-pointer ${
                    audioSourceType === "idle" ? "opacity-40 cursor-not-allowed bg-white/5 border border-white/10" : "hover:scale-105 active:scale-95"
                  }`}
                  style={audioSourceType !== "idle" ? {
                    backgroundColor: isPlaying ? "rgba(255,255,255,0.1)" : activePalette.accent,
                    color: isPlaying ? activePalette.ink : activePalette.bg,
                    border: `1px solid ${isPlaying ? "rgba(255,255,255,0.2)" : "transparent"}`
                  } : {}}
                  title={isPlaying ? "Pause" : "Play"}
                >
                  {audioSourceType === "idle" ? (
                    <div className="w-2.5 h-2.5 rounded-full bg-white/30" />
                  ) : isPlaying ? (
                    <div className="flex space-x-1">
                      <div className="w-1 h-3 rounded-sm bg-current" />
                      <div className="w-1 h-3 rounded-sm bg-current" />
                    </div>
                  ) : (
                    <div className="w-0 h-0 border-t-[5px] border-t-transparent border-l-[8px] border-l-current border-b-[5px] border-b-transparent ml-0.5" />
                  )}
                </button>
              </div>

              <div
                className="pointer-events-auto flex items-center space-x-2 sm:space-x-3 px-3 py-1.5 sm:px-4 py-2 rounded-full bg-white/5 backdrop-blur-md border border-white/10 shadow-lg text-[9px] sm:text-xs font-medium tracking-wide"
                style={{ color: activePalette.ink }}
              >
                <span className="opacity-70 hidden sm:inline">Scroll disc/seeker to skip</span>
                <span className="w-1 h-1 rounded-full opacity-40 hidden sm:block" style={{ backgroundColor: activePalette.ink }}></span>
                <span className="opacity-70">{lyrics.length > 0 ? `${String(activeLyricIndex + 1).padStart(2, "0")} / ${String(lyrics.length).padStart(2, "0")}` : "00 / 00"}</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
